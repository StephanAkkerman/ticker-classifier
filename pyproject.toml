[project]
name = "ticker_classifier"
dynamic = ["version"]
description = "A robust stock, crypto, and forex classifier with async support."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Stephan Akkerman", email = "stephan@akkerman.ai" },
]
dependencies = [
 "requests==2.32.4",
  "aiohttp==3.13.5",
  "financedatabase==2.3.1",
  "tradingview-scraper==0.4.20"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Single source of truth for the version: the package's `_version.py`.
# A release bumps that one literal; this reads it, so the two cannot drift.
[tool.setuptools.dynamic]
version = { attr = "ticker_classifier._version.__version__" }

[tool.setuptools.packages.find]
include = ["ticker_classifier*"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
profile = "black"

[tool.ruff]
line-length = 88
#select = ["I001"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "numpy"
